<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil-ExploreRisaralda</title>
    <link rel="stylesheet" href="css/perfil.css">
</head>
<body>
    <header>
        <!-- Header superior -->
        <div class="navigation-1">
                <div class="nav nav-logo">
                    <img src="./img/logo-removebg-preview (1).png" alt="Logo">
                </div>
                <div class="nav nav-title">
                    <h1>ExploreRisaralda</h1>
                </div>
                <div class="nav nav-icons">
                    <a href=""><ion-icon name="notifications-outline"></ion-icon></a>
                    <a href=""><ion-icon name="heart-outline"></ion-icon></a>
                    <!-- menu despegable -->
                    <div class="menu-container">
                        <a href=""><ion-icon class="profile-icon" name="person-outline"></ion-icon></a>
                        <div class="dropdown-menu">
                            <a class="a-perfil" href="">Perfil</a>
                            <a class="a-perfil" href="">Iniciar Sesion</a>
                            <a class="a-perfil" href="">Registrarse</a>
                        </div>
                    </div>
                </div>
        </div>


        <!-- Header inferior -->
        <div class="navigation-2">
            <div class="input-container">
                <ion-icon name="search-outline"></ion-icon>
                <input type="text" placeholder="Buscar...">
            </div>
            <nav class="nav-menu">
                <a href="">Municipios</a>
                <a href="">Paquetes</a>
            </nav>
        </div>
    </header>

    <main>
        <div class="container-perfil">
            <div class="perfil">
                <a href=""><ion-icon name="person-outline"></ion-icon>Datos personales</a>
                <a href=""><ion-icon name="heart-outline"></ion-icon>Favoritos</a>
                <a href=""><ion-icon name="settings-outline"></ion-icon>Configurar Cuenta</a>
                <a href=""><ion-icon name="notifications-outline"></ion-icon>Notificaciones</a>
                <a href=""><ion-icon name="power-outline"></ion-icon>Cerrar Sesion</a>
            </div>
            <div class="container-container">
                <div class="titulo">
                    <h3>Datos personales</h3>
                </div>
                <div class="info-perfil">
                    <div class="izquierda">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" value="Luisa" readonly> 
    
                        <label for="documento">Tipo de documento</label>
                        <input type="text" id="documento" value="1087988747" readonly>
    
                        <label for="correo">Correo Electronico</label>
                        <input type="text" id="correo" value="luisacoy2005@gmail.com" readonly>
                    </div>
    
                    <div class="derecha">
                        <label for="apellidos">Apellidos</label>
                        <input type="text" id="apellidos" value="Jimenez Coy" readonly>
    
                        <label for="celular">Celular</label>
                        <input type="text" id="celular" value="323383524" readonly>
                        <a href=""><ion-icon name="pencil-outline"></ion-icon></a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="text/javascript" src="js/header.js"></script>
    <script  type = "module"  src = " https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js " > </script> 
    <script  nomodule  src = " https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js " > </script>
</body>
</html>
