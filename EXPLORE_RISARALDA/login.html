<!-- Seccion login -->
<div class="conteiner-registro">
    <div class="form-registro">
        <h2>Inicia Sesión</h2>
        <br>
        <p class="texto-bienve">Bienvenido a ExploreRisaralda.</p>
        <form action="#" method="post">
            <div class="grupo">
                <label for="nombre">E-mail:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div class="grupo">
                <label for="contrasena">Contraseña:</label>
                <input type="password" id="contrasena" name="contrasena" required>
            </div>
           
            <div class="grupo checkbox-grupo">
                <input type="checkbox" id="terminos" name="terminos" required>
                <label for="terminos">Acepta términos y condiciones</label>
            </div>
           
            <p class="campo-obli">*Campos obligatorios</p>
            <a href="./info_empresa.html"><button type="submit" class="boton-regis">Ingresar</button></a>
        </form>
        <p class="solicitud">¿Aun no tienes cuenta? Ingresa aquí <a href="./registro.html">Ingresa Aquí</a></p>
    </div>
</div>
