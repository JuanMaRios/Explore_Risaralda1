<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/EXPLORE_RISARALDA/css/login.css">
</head>
<body>
    <header>
        <div class="encabezado">
            <h1>ExploreRisaralda</h1>
            <nav class="partes_header">
                <a href="#">Inicio</a>
                <a href="#">Municipios</a>
                <a href="#">Paquetes</a>
                <a href="#"><i class="bi bi-bell"></i></a>    
                <a href="#"><i class="bi bi-heart"></i></a>
                <a href="#"><i class="bi bi-cart"></i></a>
                <a href="#"><i class="bi bi-person-circle"></i></a>
            </nav>
        </div>
    </header>
    <!-- Seccion login -->
    <div class="login-container">
        <div class="login-forma">
            <h2>Iniciar Sesión</h2>
            <hr>
            
            <br>
            <form action="#" method="post">
                
                <div class="inicial">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required>
                   
                </div>
                
                <br>
                <br>                
                <div class="inicial">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <span class="required">*Campos Obligatorios</span> 
                <button type="submit" class="boton_inicio">Entrar</button>
                <div class="opciones">
                    <label>
                        <input type="checkbox" name="remember"> No cerrar sesión
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste Contraseña?</a>
                </div>
                <div class="registro">
                    ¿No tienes cuenta? <a href="/EXPLORE_RISARALDA/registro.html">Regístrate</a>
                </div>
            </form>
        </div>
    </div>
    
</body>
</html>
