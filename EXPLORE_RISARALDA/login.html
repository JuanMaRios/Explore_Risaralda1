<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion</title>
    <link rel="icon" href="./img/logo_sin_fondo.png" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/EXPLORE_RISARALDA/css/login.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <!-- Header superior -->
        <div class="navigation-1">
                <div class="nav nav-logo">
                    <a href="./inicio.html"><img src="./img/logo_sin_fondo.png" alt="Logo"></a>  
                    <a href="./inicio.html"><h1>ExploreRisaralda</h1></a>  
                </div>
                
        </div>

    </header>
        <div class="login-container">
            <div class="login-forma">
                <h2>Iniciar Sesión</h2>
                <hr>
                
                <br>
                <form action="#" method="post">
                    
                    <div class="inicial">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" required>
                       
                    </div>
                    
                    <br>
                    <br>                
                    <div class="inicial">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                
                    <button type="submit" class="boton_inicio">Entrar</button>
                    <div class="opciones">
                        <label>
                            <input type="checkbox" name="remember"> No cerrar sesión
                        </label>
                        <a href="#" class="forgot-password">¿Olvidaste Contraseña?</a>
                    </div>
                    <div class="registro">
                        ¿No tienes cuenta? <a href="/EXPLORE_RISARALDA/registro.html">Regístrate</a>
                    </div>
                </form>
            </div>
        </div>
   
    <!-- Seccion login -->
   
    <script type="text/javascript"  src="js/dosquebradas.js"></script>

    <script tipo="módulo" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomódulo src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
</body>
</html>
