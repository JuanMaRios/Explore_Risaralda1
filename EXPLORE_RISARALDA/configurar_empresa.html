<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Configurar Cuenta </title>
    <link rel="stylesheet" href="./EXPLORE_RISARALDA/css/configurar_empresa.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>
    <header>
        <!-- nombre de la pagina -->
        <h1> ExploreRisaralda </h1>
        <nav>
            <!-- boton de buscar -->
            <button id="buscar"> <i class="bi bi-search"></i> </button>
            
            <!-- boton de crear paquetes -->
            <div class="boton-modal"> 
                <label for="btn-modal">
                    Crear paquetes
                </label>
            </div>
            <!-- fin del boton -->

            <!-- ventana modal -->
            <input type="checkbox" id="btn-modal">
            <div class="container-modal">
                <div class="content-modal">
                    <h2> Crea tu paquete! </h2>
                    
                    <div id="creacion">
                        <div id="casilla1-nombre">
                            <p> Nombre: </p>
                            <input type="text" id="nombrePaquete">
                        </div>

                        <div id="casilla2-actividad">
                            <p> Actividad: </p>
                            <input type="text" id="actividadPaquete">
                        </div>

                        <div id="casilla3-precio">
                            <p> Precio: </p>
                            <input type="number" id="precioPaquete" placeholder="$">
                        </div>

                        <div id="casilla4-ubicacion">
                            <p> Ubicación: </p>
                            <input type="text" id="ubicacionPaquete">
                        </div>

                        <div id="casilla5-terminos">
                            <p> Terminos y condiciones: </p>
                            <input type="text" id="terminosPaquete">
                        </div>

                        <div id="casilla6-fotos">
                            <p> Adjuntar Imagenes: </p>
                            <div id="imagenes">
                                <div id="imagen1"> <i class="bi bi-file-earmark-image"></i> </div>
                                <div id="imagen2"> <i class="bi bi-file-earmark-image"></i> </div>
                                <div id="imagen3"> <i class="bi bi-file-earmark-image"></i> </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="btn-cerrar">
                        <label for="btn-modal"> Crear </label>
                    </div>
                </div>
                <label for="btn-modal" class="cerrar-modal"></label>
            </div>

            <!-- <button id="crearpaquetes"> <i id="icono-mas" class="bi bi-plus"></i> Crear paquetes </button> -->
            
            <!-- notificaciones -->
            <a href="#"><i id="iconoNoti" class="bi bi-bell"> </i></a>
            <!-- icono de empresa -->
            <a href="#"><i id="iconoEmpresa" class="bi bi-building"></i></a>
        </nav>
    </header>

    <!-- contenido principal de la pagina -->
    <main>
        <!-- Seccion de la izquierda (menu de navegación) -->
        <div class="menu_opciones">
            
            <!-- Primera parte - titulo de ajustes y boton de cerrar -->
            <div id="titulo-ajustes"> 
                <h3 id="ajustes"> Ajustes </h3> 
                <a href="#"> <i id="icono-cerrar" class="bi bi-file-excel"></i> </a> 
            </div>
            <hr>
            
            <!-- Segunda Parte - Opciones de navegación -->
            <div id="datosEmpresa"> <i id="icono-datosEmpresa" class="bi bi-building"></i> <a href="#"> Datos de empresa </a> </div>
            <div id="misPaquetes"> <i id="icono-paquetes" class="bi bi-calendar3-range"></i> <a href="#"> Mis Paquetes </a> </div>
            <div id="configurarCuenta"> <i id="icono-configuracion" class="bi bi-gear"></i> <a href="#"> Configurar cuenta </a> </div>
            <div id="cerrarSesion"> <i id="icono-cerrarSesion" class="bi bi-power"></i> <a href="#"> Cerrar sesión </a> </div>
        </div>

        <div class="contenido"> 
            <h2> Cambiar Contraseña </h2>

            <div id="contraseña-actual">
                <p> Contraseña actual: </p>
                <input type="password" id="contraseña1" placeholder="Ingrese su contraseña actual">
            </div>

            <div id="nueva-contraseña">
                <p> Nueva contraseña: </p>
                <input type="password" id="contraseña2" placeholder="Ingrese su nueva contraseña">
            </div>

            <div id="opciones">
                <div id="cambiar-contraseña"> Cambiar contraseña </div>

                <div id="eliminar-cuenta"> Eliminar cuenta </div>
            </div>
        
        
        </div>
    
    </main>
</body>
</html>
