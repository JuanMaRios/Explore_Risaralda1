<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro Usuario</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/registro.css">
</head>
<body>
    <header>
        <div class="encabezado">
            <h1>ExploreRisaralda</h1>
            <nav class="partes_header">
                <a href="#">Inicio</a>
                <a href="#">Municipios</a>
                <a href="#">Paquetes</a>
                <a href="#"><i class="bi bi-bell"></i></a>    
                <a href="#"><i class="bi bi-heart"></i></a>
                <a href="#"><i class="bi bi-cart"></i></a>
                <a href="#"><i class="bi bi-person-circle"></i></a>
            </nav>
        </div>
    </header>
    <!-- Seccion Registrp -->
    <div class="login-container">
        <div class="login-forma">
            <h2>Registrate</h2>
            <hr>
            <h3>Bienvenidos a ExploreRisaralda. Registrate para obtener beneficios</h3>
            <br>
            <form action="#" method="post">  
                <div class="inicial">
                    <label for="text">Nombre:</label>
                    <input type="text" id="text" name="text" required>                   
                </div>
                <div class="inicial">
                    <label for="text">Apellidos:</label>
                    <input type="text" id="text" name="text" required>                   
                </div>              
                <div class="inicial">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>                   
                </div>                                
                <div class="inicial">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <div class="inicial">
                    <label for="password">Confirmación:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                
                <span class="required">*Campos Obligatorios</span> 
                <div class="opciones">
                    <label>
                        <input type="checkbox" name="remember">Acepta terminos y condiciones
                    </label>
                    
                </div>
                <div class="opciones">
                    <label>
                        <input type="checkbox" name="remember"> Acepta recibir notificaciones respectivas a la pagina
                    </label>
                    
                </div>
                <button type="submit" class="boton_inicio">Ingresar</button>
                
                <div class="registro">
                    ¿Eres una empresa? <a href="/EXPLORE_RISARALDA/registro_empre.html">Regístrate Aqui</a>
                </div>
            </form>
        </div>
    </div>




</body>
</html>
