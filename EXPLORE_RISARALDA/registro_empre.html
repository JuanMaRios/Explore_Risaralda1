<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro empresa</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./css/registro_empre.css">
    <link rel="icon" href="./img/logo_sin_fondo.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <!-- Header superior -->
        <div class="navigation-1">
                <div class="nav nav-logo">
                    <a href="./inicio.html"><img src="./img/logo_sin_fondo.png" alt="Logo"></a>  
                    <a href="./inicio.html"><h1>ExploreRisaralda</h1></a>  
                </div>
                
        </div>

    </header>
    <!-- Seccion Registrp -->
    <div class="conteiner-registro">
        <div class="form-registro">
            <h2>Regístra tu emprendimiento</h2>
            <br>
            <p class="texto-bienve">Bienvenidos a ExploreRisaralda. Regístrate para obtener beneficios.</p>
            <form action="#" method="post">
                <div class="grupo">
                    <label for="nombre">Nombre de la empresa:</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div>
                <div class="grupo">
                    <label for="apellidos">RUT:</label>
                    <input type="text" id="apellidos" name="apellidos" required>
                </div>
                <div class="grupo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="grupo">
                    <label for="contrasena">Contraseña:</label>
                    <input type="password" id="contrasena" name="contrasena" required>
                </div>
                <div class="grupo">
                    <label for="confirmacion">Confirmación:</label>
                    <input type="password" id="confirmacion" name="confirmacion" required>
                </div>
                <div class="grupo checkbox-grupo">
                    <input type="checkbox" id="terminos" name="terminos" required>
                    <label for="terminos">Acepta términos y condiciones</label>
                </div>
                <div class="grupo checkbox-grupo">
                    <input type="checkbox" id="notificaciones" name="notificaciones">
                    <label for="notificaciones">Acepta recibir notificaciones respectivas a la página</label>
                </div>
                <p class="campo-obli">*Campos obligatorios</p>
                <a href="./info_empresa.html"><button type="submit" class="boton-regis">Ingresar</button></a>
            </form>
            <p class="solicitud">¿Ya tienes empresa? <a href="./info_empresa.html">Ingresa Aquí</a></p>
        </div>
    </div>
</body>
</html>
