<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExploreRisaralda - Carrito</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <link rel="stylesheet" href="css/carrito.css">
</head>
<body>
    <header>
        <div class="barra-superior">
            <h1 class="logo">ExploreRisaralda</h1>
            <nav class="nav-icons">
                <i class="bi bi-bell"></i>
                <i class="bi bi-heart"></i>
                <a href="#">Inicio</a>
                <a href="#">Iniciar sesion</a>
            </nav>
        </div>
        <div class="nav-bar">
            <a href="#">Paquetes</a>
            <a href="#">Municipios</a>
            <a><i class="bi bi-cart"></i></a>
            <div class="search-bar">
                <button type="submit"><i class="bi bi-search"></i></i></button>
                <input type="text" placeholder="Search...">
            </div>
        </div>
    </header>
    <main>
        <div class="paquetes-vaciarcarrito">
            <p>PAQUETES</p>
            <button>Vaciar Carrito</button>
        </div>
        <section class="contenedor-carrito">
            <div class="paquete-carrito">
                <img src="/Explore_Risaralda1/EXPLORE_RISARALDA/img/cascada-santa-helena.jpg" alt="imagen casacada santa helena">
                <div class="info-carrito">
                    <h2>Cascada Santa Helena</h2>
                    <p>Santa Rosa de Cabal</p>
                    <div class="btn-personas">
                        <i class="bi bi-person"></i>
                        <p>2</p>
                    </div>
                    <input type="date">
                    <div class="botones">
                        <button>Editar</button>
                        <button>Quitar</button>
                    </div>
                </div>
                <div class="detalle-compra">
                    <h2>Detalle de compra</h2>
                    <div>
                        <p>total</p>
                        <p>$100.000</p>
                    </div>
                    <button>comprar</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
