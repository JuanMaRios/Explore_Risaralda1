<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="./EXPLORE_RISARALDA/css/informacion_e.css">

</head>
<body>
    <!-- ----------------------encabezado------------------------- -->
    <header>
        <!-- nombre de la pagina -->
        <h1> ExploreRisaralda </h1>
        <nav>
            <button id="buscar"> <i class="bi bi-search"></i> </button>

            <a href="#"><i id="iconoNoti" class="bi bi-bell"> </i></a>
            <a href="#"><i id="iconoEmpresa" class="bi bi-building"></i></a>
        </nav>
    </header>

    <!-- contenido principal de la pagina -->
    <main>
        <!-- Seccion de la izquierda (menu de navegación) -->
        <div class="menu_opciones">
            
            <!-- Primera parte - titulo de ajustes y boton de cerrar -->
            <div id="titulo-ajustes"> 
                <h3 id="ajustes"> Ajustes </h3> 
                <a href="#"> <i id="icono-cerrar" class="bi bi-file-excel"></i> </a>

            <hr>
            
            <!-- Segunda Parte - Opciones de navegación -->
            <div id="datosEmpresa"> <i id="icono-datosEmpresa" class="bi bi-building"></i> <a href="#"> Datos de empresa </a> </div>

            <!-- <button id="sesion">  <i class="bi bi-power"></i> Cerrar sesión </button> -->

        <!-- sección donde se encuentra el contenido principal -->
        <div class="contenido"> 
            <h2> Datos de empresa </h2>
            
            <div id="info-empresa"> 
                <h4> Nombre de la entidad </h4>
                <div id="nombre-empresa"> </div>

                <h4> Dirección </h4>
                <div id="direccion-empresa"> </div>
                <br>

                <h4> RUT </h4>
                <div id="rut"> </div>

                <h4> Contacto </h4>
                <div id="contacto-empresa"> +57 </div>
                <br>

                <h4> Correo electronico </h4>
                <div id="mail"> </div>

                <h4> ID Dueño </h4>
                <div id="identificación"> </div>
            </div>
        </div>
